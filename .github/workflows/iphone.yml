name: Build iPhone app
on:
  push:
    branches: [main, iphone-native]
    paths: ['ios/**', 'assets/**', '.github/workflows/iphone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build for physical iPhone
        run: |
          xcodebuild -version
          xcodebuild -project ios/QuizPocket.xcodeproj -scheme QuizPocket -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned arm64 IPA
        working-directory: ${{ runner.temp }}
        run: |
          mkdir Payload
          mv build/Build/Products/Release-iphoneos/QuizPocket.app Payload/
          app=Payload/QuizPocket.app
          lipo "$app/QuizPocket" -verify_arch arm64
          test -f "$app/assets/index.html"
          /usr/bin/ditto -c -k --keepParent Payload QuizPocket-unsigned.ipa
          unzip -tq QuizPocket-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-IPA
          path: ${{ runner.temp }}/QuizPocket-unsigned.ipa
          if-no-files-found: error
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Boot iPhone Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - name: Exercise native document import and practice persistence
        run: xcodebuild -project ios/QuizPocket.xcodeproj -scheme QuizPocket -destination "id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/sim-tests" -resultBundlePath "$RUNNER_TEMP/results.xcresult" test
      - name: Capture iPhone home screen
        if: always()
        run: bash ios/smoke-simulator.sh "$SIMULATOR_ID" "$RUNNER_TEMP/iphone-home.png"
      - name: Diagnose app launch failure
        if: failure()
        run: |
          find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator" -name 'QuizPocket*.ips' -print -exec head -c 14000 {} \; 2>/dev/null || true
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 8m --predicate 'process == "QuizPocket"' --style compact | tail -120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-preview
          path: ${{ runner.temp }}/iphone-home.png
          if-no-files-found: ignore
